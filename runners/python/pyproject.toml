[project]
name = "oes-runner"
version = "0.1.0"
description = "Reference Python runner for the Open Eval Standard (OES)"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["ruamel.yaml>=0.18", "jsonschema>=4.18"]

[project.scripts]
oes = "oes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["oes.py", "oes_schemas"]
