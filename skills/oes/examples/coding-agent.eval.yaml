oes: 1
name: coding-agent
description: The agent makes a change to a small repo, then follows up, and the repo's tests pass.
target: {command: "python -m agent.eval_entry", timeout_s: 900}
scorers:                       # scorer names are your own choice
  - name: tests-pass
    check: {command: "python checks/run_tests.py"}   # runs the repo's tests on the agent's output
    pass: {mean: 0.8}
  - {name: stays-in-repo, check: tool_not_called, pass: {each: 1}}
  - {name: cost, check: cost_per_trial_usd, pass: {max: 0.50}}
cases:
  - id: add-due-date
    input:
      data:
        repo: {type: file, path: fixtures/todo-app, mime: inode/directory}
        task: Add an optional due date to each todo item.
      script:
        - {data: {task: Now add tests for the due date.}}
      max_turns: 2
    expected:
      tests-pass: {min_passing: 12}
      stays-in-repo: [push_to_remote, delete_branch]
