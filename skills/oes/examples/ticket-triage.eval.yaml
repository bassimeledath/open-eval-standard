oes: 1
name: ticket-triage
description: The app sends each support ticket to the right queue, quickly.
target: {command: "python -m triage.eval_entry"}
scorers:
  - {name: right-queue, check: equals, pass: {mean: 0.9}}
  - {name: fast, check: latency_p95_ms, pass: {max: 2000}}
cases:
  - id: charged-twice
    input:
      data: {subject: "Charged twice", body: "I was billed two times for one order."}
    expected:
      right-queue: {data.queue: billing}
  - id: reset-email
    input:
      data: {subject: "Can't log in", body: "The reset email never arrives."}
    expected:
      right-queue: {data.queue: account}
